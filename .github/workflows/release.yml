name: Release extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate tag and build
        shell: bash
        run: |
          version="$(node -p 'require("./manifest.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          npm run package
          cd dist
          sha256sum "youtube-digest-v$version.zip" > "youtube-digest-v$version.zip.sha256"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/youtube-digest-$GITHUB_REF_NAME.zip" \
            "dist/youtube-digest-$GITHUB_REF_NAME.zip.sha256" \
            --verify-tag \
            --title "YouTube Digest Local $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE.md
